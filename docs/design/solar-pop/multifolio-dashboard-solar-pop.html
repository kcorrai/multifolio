html,body{margin:0;padding:0;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}

<div data-d="shell" style="min-height:100vh;background:var(--surface-page);display:grid;grid-template-columns:248px 1fr">

    {{ sideNav }}
    {{ sideFoot }}

  <main style="min-width:0;display:grid;align-content:start">
    {{ topBar }}
    {{ screen }}

</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;jobs&quot;,&quot;pipeline&quot;,&quot;profile&quot;,&quot;platforms&quot;,&quot;portfolio&quot;,&quot;cv&quot;,&quot;interview&quot;,&quot;start&quot;,&quot;feedback&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page&quot;}}">
const h = React.createElement;
const DS = () => (window.SolarPopStudioDesignSystem_db4228 || {});
const I = (n, s, c) => DS().Icon ? h(DS().Icon, { name: n, size: s || 16, color: c }) : null;
const Btn = (l, p) => DS().Button ? h(DS().Button, p, l) : h('button', p, l);

const NAV = [
  { id: 'home', label: 'Today', icon: 'sun', group: 'Work' },
  { id: 'jobs', label: 'Job feed', icon: 'globe', group: 'Work', badge: '12' },
  { id: 'pipeline', label: 'Pipeline', icon: 'asterisk', group: 'Work', badge: '3' },
  { id: 'profile', label: 'Profile', icon: 'flower', group: 'Assets' },
  { id: 'platforms', label: 'Platforms', icon: 'monitor', group: 'Assets' },
  { id: 'portfolio', label: 'Portfolio', icon: 'package', group: 'Assets' },
  { id: 'cv', label: 'CV', icon: 'check', group: 'Assets' },

const TITLES = {

  jobs: ['Scored Job', 'feed', '12 new listings since yesterday, ranked against your actual profile.'],
  pipeline: ['Your', 'pipeline', 'Where every application stands — and who owes you a reply.'],
  profile: ['One Profile,', 'many uses', 'Everything downstream reads from this single record.'],
  platforms: ['Platform', 'versions', 'The same history, rewritten in each platform’s register.'],
  portfolio: ['Your Public', 'page', 'Themed by you — Multifolio branding never appears on it.'],

  interview: ['Mock', 'interviews', 'Questions from the posting you are actually applying to.'],
  start: ['Five Steps to Your First', 'reply', 'Each step unlocks the next one — no busywork.'],

const JOBS = [

  { role: 'Senior Product Designer', co: 'Paylane · Remote US', rate: '$85–110/hr', score: 88, why: 'Strong skill match, rate above your band', posted: '5h ago', applied: false },
  { role: 'Design Ops Manager', co: 'Kanto · Remote', rate: '$90/hr', score: 79, why: 'Ops matches, no line-management history listed', posted: '1d ago', applied: true },
  { role: 'UX Designer, Growth', co: 'Bloomlane · Remote US', rate: '$70/hr', score: 74, why: 'Growth experimentation missing from your profile', posted: '1d ago', applied: false },
  { role: 'Brand Designer (contract)', co: 'Studio Nine · Remote', rate: '$55/hr', score: 61, why: 'Below your rate floor and outside your domain', posted: '2d ago', applied: false },
];

const PIPE = [
  { stage: 'Drafted', tone: 'cream', items: [['Northwind', 'Design Systems Lead', 'Draft ready'], ['Paylane', 'Senior Product Designer', 'Draft ready']] },
  { stage: 'Sent', tone: 'peach', items: [['Kanto', 'Design Ops Manager', '3 days ago'], ['Mesa', 'Systems Designer', '5 days ago'], ['Orbit', 'Product Designer', '6 days ago']] },
  { stage: 'Replied', tone: 'pink', items: [['Bloomlane', 'UX Designer, Growth', 'Asked for rates'], ['Verd', 'Design Lead', 'Wants a call']] },
  { stage: 'Interviewing', tone: 'flame', items: [['Northwind', 'Design Systems Lead', 'Round 2 Thursday']] },
];

class Component extends DCLogic {
  state = { screen: 'home', reduced: false, openJob: -1 };
  componentDidMount() {
    this.setState({ reduced: window.matchMedia('(prefers-reduced-motion: reduce)').matches, screen: this.props.screen || 'home' });
  }

  // ---- primitives (tiny labels use warm ink for contrast; colour is reserved for display type)
  lab(t, color) {
    return h('span', { key: 'l' + t, style: { font: 'var(--fw-bold) var(--fs-label)/1 var(--font-display)', letterSpacing: 'var(--tracking-label)', textTransform: 'uppercase', color: color || 'var(--ink-700)' } }, t);
  }
  page(kids) {
    return h('div', { 'data-d': 'pad', style: { display: 'grid', gap: 20, padding: '20px 28px 64px', minWidth: 0, animation: this.state.reduced ? 'none' : 'dbIn .2s var(--ease-out) both' } }, kids);
  }
  card(kids, bg) {
    return h('div', { style: { display: 'grid', gap: 16, alignContent: 'start', padding: 24, minWidth: 0, borderRadius: 'var(--radius-xl)', background: bg || 'var(--white)', boxShadow: bg ? 'none' : 'var(--shadow-soft)' } }, kids);
  }
  head(title, right, sub) {
    return h('div', { key: 'h', style: { display: 'grid', gap: 6 } }, [
      h('div', { key: 'r', style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 12 } }, [
        h('h2', { key: 't', style: { marginRight: 'auto', font: 'var(--fw-black) var(--fs-title)/1.15 var(--font-display)', letterSpacing: 'var(--tracking-display)', textTransform: 'uppercase', color: 'var(--text-strong)' } }, title),
        right || null,
      ]),
      sub ? h('span', { key: 's', style: { font: 'var(--fw-regular) var(--fs-body-s)/1.55 var(--font-body)', color: 'var(--text-body)' } }, sub) : null,

  }
  pill(text, tone) {
    const m = { pink: ['var(--pink-200)', 'var(--ink-900)'], peach: ['var(--peach-200)', 'var(--ink-900)'], amber: ['var(--amber-200)', 'var(--ink-900)'], flame: ['var(--ink-900)', 'var(--white)'], cream: ['var(--surface-page)', 'var(--ink-700)'], white: ['var(--white)', 'var(--ink-900)'] }[tone || 'pink'];
    return h('span', { key: 'p' + text, style: { display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 12px', borderRadius: 'var(--radius-pill)', background: m[0], color: m[1], font: 'var(--fw-bold) var(--fs-label)/1 var(--font-display)', letterSpacing: 'var(--tracking-label)', textTransform: 'uppercase', whiteSpace: 'nowrap' } }, text);
  }
  credits(n) {
    return h('span', { key: 'c', style: { display: 'inline-flex', alignItems: 'center', gap: 7, padding: '7px 12px', borderRadius: 'var(--radius-pill)', background: 'var(--pink-200)', color: 'var(--ink-900)', font: 'var(--fw-bold) var(--fs-label)/1 var(--font-display)', letterSpacing: '.08em', textTransform: 'uppercase', whiteSpace: 'nowrap' } }, [I('sun', 12), n + (n === 1 ? ' credit' : ' credits')]);
  }
  bar(k, l, pct, ink, inv) {
    return h('div', { key: k, style: { display: 'grid', gap: 7, minWidth: 0 } }, [
      h('div', { key: 'r', style: { display: 'flex', justifyContent: 'space-between', gap: 10, font: 'var(--fw-bold) var(--fs-label)/1 var(--font-display)', letterSpacing: '.06em', textTransform: 'uppercase', color: inv ? 'var(--white)' : 'var(--ink-700)' } }, [
        h('span', { key: 'a' }, l), h('span', { key: 'b', style: { color: inv ? 'var(--white)' : 'var(--text-strong)' } }, pct),
      ]),
      h('div', { key: 't', style: { height: 8, borderRadius: 'var(--radius-pill)', background: inv ? 'rgba(255,255,255,.3)' : 'var(--cream-300)', overflow: 'hidden' } },
        h('div', { style: { width: pct + '%', height: '100%', borderRadius: 'var(--radius-pill)', background: inv ? 'var(--white)' : (ink || 'var(--flame-500)') } })),
    ]);
  }
  score(v, size) {
    const s = size || 64;
    const ink = v >= 80 ? 'var(--pink-500)' : v >= 60 ? 'var(--amber-400)' : 'var(--flame-500)';
    return h('span', { key: 'sc', style: { width: s, height: s, flex: '0 0 auto', borderRadius: 'var(--radius-pill)', background: 'conic-gradient(' + ink + ' 0% ' + v + '%, var(--cream-300) ' + v + '% 100%)', display: 'grid', placeItems: 'center' } },
      h('span', { style: { width: s - 14, height: s - 14, borderRadius: 'var(--radius-pill)', background: 'var(--white)', display: 'grid', placeItems: 'center', font: 'var(--fw-black) ' + Math.round(s / 3.4) + 'px/1 var(--font-display)', color: 'var(--text-strong)' } }, v));
  }
  row(kids, bg) {
    return h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 12, padding: '14px 16px', borderRadius: 'var(--radius-md)', background: bg || 'var(--surface-page)', minWidth: 0 } }, kids);
  }
  input(o) {
    return h('label', { key: o.k, style: { display: 'grid', gap: 7, minWidth: 0 } }, [
      this.lab(o.label, 'var(--text-strong)'),
      o.rows
        ? h('textarea', { rows: o.rows, defaultValue: o.value, placeholder: o.ph, style: { padding: 14, border: 'none', outline: 'none', borderRadius: 'var(--radius-md)', background: 'var(--surface-page)', font: 'var(--fw-regular) var(--fs-body)/1.7 var(--font-body)', color: 'var(--text-strong)', resize: 'vertical' } })
        : h('input', { defaultValue: o.value, placeholder: o.ph, style: { minHeight: 48, padding: '0 14px', border: 'none', outline: 'none', borderRadius: 'var(--radius-md)', background: 'var(--surface-page)', font: 'var(--fw-medium) var(--fs-body-l)/1 var(--font-body)', color: 'var(--text-strong)' } }),
      o.hint ? h('span', { style: { font: 'var(--fw-bold) var(--fs-label)/1.4 var(--font-display)', letterSpacing: '.06em', color: 'var(--ink-500)' } }, o.hint) : null,
    ]);
  }

  // ---- chrome
  sideNav() {
    const groups = [];
    NAV.forEach(n => { const g = groups.find(x => x.name === n.group); if (g) g.items.push(n); else groups.push({ name: n.group, items: [n] }); });
    return h('nav', { 'data-d': 'sidenav', style: { display: 'flex', flexDirection: 'column', gap: 16, flex: 1, minHeight: 0, overflowY: 'auto' } }, groups.map(g =>

        ...g.items.map(n => {
          const on = this.state.screen === n.id;
          return h('button', {

            style: {
              display: 'flex', alignItems: 'center', gap: 11, width: '100%', minHeight: 42, padding: '0 12px',
              border: 'none', cursor: 'pointer', borderRadius: 'var(--radius-pill)', whiteSpace: 'nowrap',
              background: on ? 'var(--ink-900)' : 'transparent', color: on ? 'var(--white)' : 'var(--ink-700)',
              font: 'var(--fw-bold) var(--fs-body-s)/1 var(--font-display)', letterSpacing: '.04em', textTransform: 'uppercase',
              boxShadow: on ? 'var(--shadow-soft)' : 'none', transition: 'all var(--dur-base) var(--ease-pop)',

            h('span', { key: 'i', style: { display: 'inline-flex', flex: '0 0 auto' } }, I(n.icon, 15, on ? 'var(--white)' : undefined)),
            h('span', { key: 't', style: { marginRight: 'auto' } }, n.label),
            n.badge ? h('span', { key: 'b', style: { padding: '3px 8px', borderRadius: 'var(--radius-pill)', background: on ? 'var(--white)' : 'var(--pink-200)', color: 'var(--ink-900)', font: 'var(--fw-black) 10px/1.4 var(--font-display)' } }, n.badge) : null,
          ]);

  }
  sideFoot() {
    return h('div', { 'data-d': 'sidefoot', style: { display: 'grid', gap: 12, padding: 16, borderRadius: 'var(--radius-lg)', background: 'var(--surface-card-peach)' } }, [
      h('div', { key: 'r', style: { display: 'flex', alignItems: 'baseline', gap: 8 } }, [
        h('span', { key: 'v', style: { font: 'var(--fw-black) var(--fs-stat)/.9 var(--font-display)', letterSpacing: 'var(--tracking-display)', color: 'var(--text-heading)' } }, '112'),
        this.lab('credits', 'var(--ink-700)'),
      ]),
      h('span', { key: 't', style: { font: 'var(--fw-regular) var(--fs-label)/1.5 var(--font-body)', color: 'var(--text-body)' } }, '≈ 112 proposals. Nothing renews, nothing expires.'),
      Btn('Buy credits', { size: 'sm', variant: 'quiet', style: { justifyContent: 'center' } }),
    ]);
  }
  topBar() {
    const t = TITLES[this.state.screen] || TITLES.home;
    return h('header', { 'data-d': 'pad', style: { padding: '26px 28px 4px', display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 14 } }, [
      h('div', { key: 'l', style: { display: 'grid', gap: 8, marginRight: 'auto', minWidth: 0 } }, [
        h('h1', { key: 'h', 'data-d': 'h1', style: { font: 'var(--fw-black) var(--fs-display-m)/var(--lh-display) var(--font-display)', letterSpacing: 'var(--tracking-display)', textTransform: 'uppercase', color: 'var(--text-strong)' } }, [
          t[0],
          h('span', { key: 's', 'data-d': 'script', style: { display: 'inline-block', marginLeft: 12, font: '400 var(--fs-script-m)/.85 var(--font-script)', letterSpacing: 0, textTransform: 'none', color: 'var(--text-heading)' } }, t[1]),
        ]),
        h('p', { key: 'p', style: { font: 'var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body)', color: 'var(--text-body)', maxWidth: '62ch' } }, t[2]),
      ]),
      h('div', { key: 'a', style: { display: 'flex', alignItems: 'center', gap: 10 } }, [
        this.credits(112),
        h('span', { key: 'av', style: { width: 40, height: 40, borderRadius: 'var(--radius-pill)', background: 'var(--action-primary)', color: 'var(--white)', display: 'inline-grid', placeItems: 'center', font: 'var(--fw-black) 15px/1 var(--font-display)' } }, 'AK'),
      ]),
    ]);
  }

  // ---- TODAY
  home() {
    const acts = [
      { n: '01', t: 'Send the Northwind proposal', s: 'Draft is written and scored 92 — it has been sitting for two days.', cta: 'Review and send', cost: 1, bg: 'var(--surface-inverse)', inv: true },
      { n: '02', t: 'Reply to Bloomlane', s: 'They asked for your rates 16 hours ago. Median reply window is 24h.', cta: 'Open thread', cost: 0, bg: 'var(--pink-100)' },
      { n: '03', t: 'Add results to two projects', s: 'Both are missing an outcome line — your biggest single score gap.', cta: 'Fix profile', cost: 0, bg: 'var(--peach-100)' },
    ];
    return this.page([
      h('div', { key: 'a', style: { display: 'grid', gap: 14 } }, acts.map(a =>
        h('div', { key: a.n, style: { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 18, padding: 22, borderRadius: 'var(--radius-xl)', background: a.bg } }, [
          h('span', { key: 'n', style: { font: 'var(--fw-black) var(--fs-display-s)/.9 var(--font-display)', letterSpacing: 'var(--tracking-display)', color: a.inv ? 'rgba(255,255,255,.55)' : 'var(--text-heading)' } }, a.n),
          h('span', { key: 'x', style: { display: 'grid', gap: 5, flex: '1 1 300px', minWidth: 0 } }, [
            h('span', { key: 't', style: { font: 'var(--fw-black) var(--fs-title)/1.2 var(--font-display)', letterSpacing: 'var(--tracking-display)', textTransform: 'uppercase', color: a.inv ? 'var(--white)' : 'var(--text-strong)' } }, a.t),

          ]),
          h('span', { key: 'c', style: { display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' } }, [

            Btn(a.cta, { size: 'md', variant: a.inv ? 'quiet' : 'primary', icon: 'arrow-right' }),

      h('div', { key: 's', 'data-d': 'quad', style: { display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 16 } }, [
        ['48', 'Proposals sent', '+9 this month'], ['40%', 'Reply rate', '+11 pts since May'],
        ['6', 'Interviewing', '1 in final round'], ['112', 'Credits left', '≈ 112 proposals'],

        this.lab(s[1], 'var(--text-strong)'),
        h('span', { key: 'n', style: { font: 'var(--fw-regular) var(--fs-label)/1.4 var(--font-body)', color: 'var(--ink-700)' } }, s[2]),
      ]))),
      h('div', { key: 't', 'data-d': 'two', style: { display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 20, alignItems: 'start' } }, [
        this.card([
          this.head('Top matches today', Btn('Open feed', { size: 'sm', variant: 'ghost', onClick: () => this.setState({ screen: 'jobs' }) })),
          h('div', { key: 'l', style: { display: 'grid', gap: 10 } }, JOBS.slice(0, 3).map(j => this.row([

            h('span', { key: 'x', style: { display: 'grid', gap: 3, flex: '1 1 190px', minWidth: 0 } }, [
              h('span', { key: 'r', style: { font: 'var(--fw-black) var(--fs-body)/1.2 var(--font-display)', textTransform: 'uppercase', letterSpacing: '.02em', color: 'var(--text-strong)' } }, j.role),
              h('span', { key: 'c', style: { font: 'var(--fw-regular) var(--fs-body-s)/1.4 var(--font-body)', color: 'var(--ink-700)' } }, j.co + ' · ' + j.rate),
            ]),
            Btn('Draft', { size: 'sm', variant: 'ghost' }),
          ]))),
        ]),
        h('div', { key: 'r', style: { display: 'grid', gap: 20 } }, [
          this.card([
            this.head('Profile strength', this.score(78, 56)),
            h('div', { key: 'b', style: { display: 'grid', gap: 10 } }, [
              this.bar('a', 'Platform fit', 91, 'var(--flame-500)'),
              this.bar('b', 'Skill match', 84, 'var(--pink-500)'),
              this.bar('c', 'Evidence', 62, 'var(--amber-400)'),
            ]),
            h('span', { key: 'n', style: { font: 'var(--fw-regular) var(--fs-body-s)/1.55 var(--font-body)', color: 'var(--text-body)' } }, 'Evidence is what holds you back — two projects have no result line.'),
          ]),
          this.card([
            this.head('Waiting on them'),

              h('span', { style: { width: 22, height: 22, borderRadius: 'var(--radius-pill)', background: 'var(--surface-page)', display: 'inline-grid', placeItems: 'center', font: 'var(--fw-black) 11px/1 var(--font-display)', color: 'var(--ink-700)' } }, i + 1), x,
            ]))),
          Btn('Install guide', { size: 'sm', style: { justifySelf: 'start' } }),
        ]),
        this.card([
          this.head('Credits', h('span', { style: { font: 'var(--fw-black) var(--fs-display-s)/1 var(--font-display)', color: 'var(--text-heading)' } }, '112')),
          h('div', { key: 'l', style: { display: 'grid', gap: 8 } }, [['Proposal', 1], ['Platform adapt', 1], ['Portfolio', 3], ['CV export', 1], ['Interview session', 3]].map(r =>
            h('div', { key: r[0], style: { display: 'flex', justifyContent: 'space-between', gap: 10, padding: '11px 13px', borderRadius: 'var(--radius-md)', background: 'var(--white)' } }, [
              h('span', { style: { font: 'var(--fw-bold) var(--fs-label)/1 var(--font-display)', letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--ink-700)' } }, r[0]),
              h('span', { style: { font: 'var(--fw-black) var(--fs-body-s)/1 var(--font-display)', color: 'var(--flame-600)' } }, r[1] + (r[1] === 1 ? ' credit' : ' credits')),
            ]))),
          h('span', { key: 'n', style: { font: 'var(--fw-regular) var(--fs-label)/1.55 var(--font-body)', color: 'var(--ink-700)' } }, 'Failed generations refund automatically. Feeds, skill overlap and ATS structure never cost credits.'),
        ], 'var(--peach-100)'),
      ]),
    ]);
  }

  // ---- FEEDBACK
  feedback() {
    return this.page([
      h('div', { key: 't', 'data-d': 'two', style: { display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 20, alignItems: 'start' } }, [
        this.card([
          this.head('What happened?', null, 'Goes straight to the team. No ticket numbers, no auto-reply.'),
          h('div', { key: 'k', style: { display: 'flex', flexWrap: 'wrap', gap: 9 } }, [['Bug', true], ['Idea', false], ['Something else', false]].map(x =>
            h('span', { key: x[0], style: { display: 'inline-flex', alignItems: 'center', gap: 8, minHeight: 36, padding: '0 15px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', whiteSpace: 'nowrap', font: 'var(--fw-bold) var(--fs-label)/1 var(--font-display)', letterSpacing: 'var(--tracking-label)', textTransform: 'uppercase', background: x[1] ? 'var(--ink-900)' : 'var(--surface-page)', color: x[1] ? 'var(--white)' : 'var(--ink-700)' } }, x[0]))),
          this.input({ k: 'm', label: 'Tell us', rows: 6, ph: 'The job feed showed 0 results after I set min score to 90…', hint: '0 / 2000' }),
          h('div', { key: 'c', style: { display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'center', padding: '13px 15px', borderRadius: 'var(--radius-md)', background: 'var(--peach-100)' } }, [
            I('asterisk', 14, 'var(--flame-600)'),
            h('span', { key: 't', style: { font: 'var(--fw-regular) var(--fs-body-s)/1.55 var(--font-body)', color: 'var(--text-body)' } }, 'Attached automatically: current page, browser and your last action. No screenshots, no console logs.'),
          ]),
          Btn('Send', { size: 'md', icon: 'arrow-right', style: { justifySelf: 'start' } }),
        ]),
        this.card([
          this.head('Your submissions', this.pill('2', 'white')),
          h('div', { key: 'l', style: { display: 'grid', gap: 11 } }, [
            ['Idea', 'Add 99designs to the platform list', 'Shipped', 'pink', '11 Jul'],
            ['Bug', 'Feed unread count did not clear', 'Looking into it', 'amber', '3 Aug'],
          ].map(r => h('div', { key: r[1], style: { display: 'grid', gap: 9, padding: 16, borderRadius: 'var(--radius-md)', background: 'var(--white)' } }, [
            h('div', { key: 'h', style: { display: 'flex', alignItems: 'center', gap: 10 } }, [
              this.pill(r[0], 'cream'), h('span', { key: 'sp', style: { flex: 1 } }),
              h('span', { key: 'd', style: { font: 'var(--fw-bold) var(--fs-label)/1 var(--font-display)', letterSpacing: '.06em', color: 'var(--ink-500)' } }, r[4]),
            ]),
            h('span', { key: 't', style: { font: 'var(--fw-black) var(--fs-body)/1.3 var(--font-display)', textTransform: 'uppercase', letterSpacing: '.02em', color: 'var(--text-strong)' } }, r[1]),
            this.pill(r[2], r[3]),
          ]))),
        ], 'var(--pink-100)'),
      ]),
    ]);
  }

  renderVals() {
    const s = this.state.screen;
    const fn = this[s];
    return {
      sideNav: this.sideNav(),
      sideFoot: this.sideFoot(),
      topBar: this.topBar(),
      screen: typeof fn === 'function' ? fn.call(this) : this.home(),
    };
  }
}

</script>
</body>
</html>
